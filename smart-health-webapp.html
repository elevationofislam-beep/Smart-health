/* Minimal offline chart renderer (SVG) with a Chart.js-like config: type bar|line, data.labels, datasets[{label,data,backgroundColor|borderColor,borderDash,pointRadius}], options.scales.y.{min,max,beginAtZero,stacked} */

const KEY="smart_health_v1";
const defaultState=()=>({lang:"ur",theme:"system",profile:null,targets:{kcal:null,p:null,water:null,useEst:true},food:{},water:{},supps:[],suppLog:{},weights:[],labs:[],sym:[],tol:[],appts:[],notif:{enabled:false,waterMin:90,meals:"08:00,13:00,20:00"},chat:[]});
let st=defaultState();
function load(){try{const r=localStorage.getItem(KEY);if(r){st=Object.assign(defaultState(),JSON.parse(r))}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){toast(t(["محفوظ نہیں ہو سکا","Could not save"]))}}
const t=(k)=>{const v=typeof k==="string"?S[k]:k;return v?v[st.lang==="ur"?0:1]:k};
const fn=(f)=>st.lang==="ur"?f.ur:f.en;
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dayShift=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const uid=()=>Math.random().toString(36).slice(2,10);
const r1=(x)=>Math.round(x*10)/10;
const r0=(x)=>Math.round(x);
const esc=(s)=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let toastT;function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);clearTimeout(toastT);setTimeout(()=>d.remove(),2200)}

/* ============ CALCULATIONS ============ */
const calc={
 bmi:(w,h)=>w&&h?r1(w/((h/100)**2)):null,
 bmiClass:(b)=>b==null?"":b<18.5?["کم وزن","Underweight"]:b<25?["نارمل","Normal"]:b<30?["زیادہ وزن","Overweight"]:["موٹاپا","Obesity"],
 bmr:(p)=>{if(!p||!p.w||!p.h||!p.age)return null;const s=p.gender==="male"?5:-161;return 10*p.w+6.25*p.h-5*p.age+s},
 tdee:(p)=>{const b=calc.bmr(p);if(!b)return null;const m={1:1.2,2:1.375,3:1.55,4:1.725}[p.activity||1];return b*m},
 kcalTarget:(p)=>{const td=calc.tdee(p);if(!td)return null;if(p.surgery&&p.surgery!=="none")return null;let k=td-500;const floor=p.gender==="male"?1500:1200;return Math.max(floor,r0(k))},
 protTarget:(p)=>{if(!p||!p.w)return null;if(p.surgery&&p.surgery!=="none")return null;return r0(p.w*1.0)},
 waterTarget:(p)=>{if(!p||!p.w)return null;if(p.surgery&&p.surgery!=="none")return null;return Math.min(3000,r0(p.w*30))},
 nutr:(foodId,g)=>{const f=FOODMAP[foodId];if(!f)return null;const o={};NUTR.forEach(n=>o[n[0]]=f[n[0]]*g/100);o.pur=f.pur==null?null:f.pur*g/100;return o}
};
function targets(){const p=st.profile||{};const T=st.targets;const bari=p.surgery&&p.surgery!=="none";
 return {kcal:T.kcal||(T.useEst&&!bari?calc.kcalTarget(p):null)||(bari?800:1500),p:T.p||(T.useEst&&!bari?calc.protTarget(p):null)||(bari?60:50),water:T.water||(T.useEst&&!bari?calc.waterTarget(p):null)||(bari?1500:2000),fromClinician:!!(T.kcal||T.p||T.water)}}
function dayTotals(date){const o={};NUTR.forEach(n=>o[n[0]]=0);o.pur=0;(st.food[date]||[]).forEach(e=>{const n=calc.nutr(e.id,e.g);if(n){NUTR.forEach(k=>o[k[0]]+=n[k[0]]);if(n.pur)o.pur+=n.pur}});return o}

 if(n===2){const ds=D(7);txt=hdr+"Weekly nutrition\n"+ds.map(d=>{const tt=dayTotals(d);return `${d}: ${r0(tt.kcal)} kcal, P ${r0(tt.p)} g, C ${r0(tt.c)} g, F ${r0(tt.f)} g, fiber ${r1(tt.fib)} g, Ca ${r0(tt.ca)} mg, Fe ${r1(tt.fe)} mg, water ${waterTotal(d)} ml`}).join("\n");csv="date,kcal,protein_g,carbs_g,fat_g,fiber_g,calcium_mg,iron_mg,magnesium_mg,potassium_mg,sodium_mg,water_ml\n"+ds.map(d=>{const tt=dayTotals(d);return [d,...NUTR.map(x=>r1(tt[x[0]])),waterTotal(d)].join(",")}).join("\n")}
 if(n===3){const ws=st.weights.filter(w=>w.date>=dayShift(-30)).sort((a,b)=>a.date.localeCompare(b.date));txt=hdr+"Weight (last 30 days)\n"+ws.map(w=>`${w.date}: ${w.w} kg`).join("\n")+(ws.length>1?`\nChange: ${r1(ws[ws.length-1].w-ws[0].w)} kg`:"");csv="date,weight_kg\n"+ws.map(w=>`${w.date},${w.w}`).join("\n")}
 if(n===4){const ds=D(30);const rows=[];ds.forEach(d=>Object.entries(st.suppLog[d]||{}).forEach(([k,v])=>{if(!v)return;const [id,tm]=k.split("@");const s=st.supps.find(x=>x.id===id);rows.push([d,s?s.name:id,tm,v])}));const tk=rows.filter(r=>r[3]==="taken").length;txt=hdr+`Supplement adherence (30 days): ${tk} taken / ${rows.length} logged (${rows.length?r0(tk/rows.length*100):0}%)\nSupplements: `+st.supps.map(s=>`${s.name} [${s.ingr}] ${s.dose||""} @ ${(s.times||[]).join(" ")}`).join("; ")+"\n"+rows.map(r=>r.join(" | ")).join("\n");csv="date,supplement,time,status\n"+rows.map(r=>`${r[0]},"${r[1]}",${r[2]},${r[3]}`).join("\n")}
 if(n===5){const ls=st.labs.slice().sort((a,b)=>a.date.localeCompare(b.date));txt=hdr+"Lab history\n"+ls.map(l=>`${l.date} ${LABS.find(x=>x[0]===l.test)[2]}: ${l.val} ${l.unit} (lab range ${l.lo??"?"}–${l.hi??"?"})${outRange(l)?" *outside range*":""} ${l.note||""}`).join("\n");csv="date,test,result,unit,ref_low,ref_high,flag,notes\n"+ls.map(l=>`${l.date},${l.test},${l.val},${l.unit},${l.lo??""},${l.hi??""},${outRange(l)?"OUT":"IN"},"${(l.note||"").replace(/"/g,"'")}"`).join("\n")}
 if(n===6){const ss=st.sym.filter(s=>s.date>=dayShift(-30)).sort((a,b)=>a.date.localeCompare(b.date));txt=hdr+"Symptoms (30 days)\n"+ss.map(s=>`${s.date} ${SYMPTOMS.find(x=>x[0]===s.type)[2]}: ${s.sev}/5 ${s.note||""}`).join("\n");csv="date,symptom,severity,notes\n"+ss.map(s=>`${s.date},${s.type},${s.sev},"${(s.note||"").replace(/"/g,"'")}"`).join("\n")}
 txt+="\n\nAll values are estimates for discussion with a clinician.";
 document.getElementById("repOut").innerHTML=`<div class="card"><div class="row"><button class="btn primary sm" onclick="copyTxt(document.getElementById('rtxt').textContent)">${t("copy")} ${t("text")}</button><button class="btn sm" onclick="copyTxt(document.getElementById('rcsv').textContent)">${t("copy")} CSV</button></div><div class="report" id="rtxt">${esc(txt)}</div><details><summary>CSV</summary><div class="report" id="rcsv">${esc(csv)}</div></details></div>`}
function copyTxt(s){const done=()=>toast(t("copied"));if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(done).catch(()=>fallback())}else fallback();function fallback(){const el=document.getElementById("rtxt")||document.body;const r=document.createRange();r.selectNodeContents(el);const sl=getSelection();sl.removeAllRanges();sl.addRange(r);toast(t(["متن منتخب ہے — لانگ پریس کر کے کاپی کریں","Text selected; long-press to copy"]))}}

/* ============ SETTINGS / MORE / PRIVACY ============ */
VIEWS.more=(el)=>{el.innerHTML=`<div class="menu">${MORE.map(m=>`<button onclick="go('${m[0]}')">${ICON(m[1])}<span>${t(m[0])}</span></button>`).join("")}</div>`};
VIEWS.privacy=(el)=>{el.innerHTML=card(t("privacy"),`<div style="white-space:pre-wrap" class="small">${t("privacyText")}</div>`)};
VIEWS.settings=(el)=>{const n=st.notif;el.innerHTML=card(t("settings"),`<div class="grid2">${field(t("lang"),sel("sLang",[["ur","اردو"],["en","English"]],st.lang))}${field(t("theme"),sel("sTheme",[["system",t("system")],["light",t("light")],["dark",t("dark")]],st.theme))}</div>`)
 +card(t("notif"),`<div class="muted small">${t("notifNote")}</div><div class="row" style="margin-top:6px"><button class="btn soft sm" onclick="askNotif()">${t("allowNotif")}</button><span class="pill ${("Notification" in window)&&Notification.permission==="granted"?"good":"warn"}">${("Notification" in window)?Notification.permission:"n/a"}</span></div><div class="grid2" style="margin-top:8px">${field(t("waterEvery"),`<input id="nW" type="number" min="0" value="${n.waterMin}">`)}${field(t("mealTimes"),`<input id="nM" value="${esc(n.meals)}">`)}</div><label class="row" style="margin-top:6px"><input type="checkbox" id="nOn" ${n.enabled?"checked":""} style="width:auto"> ${t(["یاد دہانیاں فعال","Reminders on"])}</label>`)
 +`<button class="btn primary block" onclick="saveSettings()">${t("save")}</button>`
 +card(t("backup"),`<div class="row"><button class="btn soft" onclick="copyTxt(JSON.stringify(st))">${t("exportJ")}</button><label class="btn">${t("importFile")}<input type="file" accept=".json,application/json" id="impF" class="hidden"></label></div><textarea id="impT" placeholder="${t("pasteHere")}"></textarea><button class="btn" onclick="importJSON(document.getElementById('impT').value)">${t("restore")}</button>`)
 +card(t("installTitle"),`<div class="small">${t("installHow")}</div>`)
 +`<button class="btn danger block" onclick="confirmBox(t('wipeConfirm'),t('yesDelete'),()=>{st=defaultState();save();go('home')})">${t("wipe")}</button><div class="muted small">Smart Health v1.0 · ${t("privacy")}: <a href="#privacy">${t("privacy")}</a></div>`;
 document.getElementById("impF").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importJSON(r.result);r.readAsText(f)}};
function saveSettings(){st.lang=document.getElementById("sLang").value;st.theme=document.getElementById("sTheme").value;st.notif={enabled:document.getElementById("nOn").checked,waterMin:+document.getElementById("nW").value||0,meals:document.getElementById("nM").value};save();render();toast(t(["محفوظ ہو گیا","Saved"]))}
function importJSON(s){try{const o=JSON.parse(s);if(!o||typeof o!=="object"||!("food" in o))throw 0;st=Object.assign(defaultState(),o);save();toast(t(["ڈیٹا بحال ہو گیا","Data restored"]));go("home")}catch(e){toast(t(["JSON درست نہیں","Invalid JSON"]))}}
function askNotif(){if(!("Notification" in window)){toast("n/a");return}Notification.requestPermission().then(()=>render())}
/* in-app reminders (only while open) */
let lastWaterN=Date.now(),firedMeals={},firedSupp={};
setInterval(()=>{if(!st.notif.enabled||!st.profile)return;const now=new Date(),hm=now.toTimeString().slice(0,5),d=today();const fire=(key,msg)=>{if(("Notification" in window)&&Notification.permission==="granted"){try{new Notification("Smart Health",{body:msg})}catch(e){}}toast(msg)};
 if(st.notif.waterMin>0&&Date.now()-lastWaterN>st.notif.waterMin*60000){lastWaterN=Date.now();fire("w",t(["پانی پینے کا وقت 💧","Time to drink water 💧"]))}
 st.notif.meals.split(/[,، ]+/).forEach(tm=>{if(tm===hm&&!firedMeals[d+tm]){firedMeals[d+tm]=1;fire("m",t(["کھانے کا وقت — ڈائری میں درج کریں","Meal time; log it in the diary"]))}});
 st.supps.forEach(s=>(s.times||[]).forEach(tm=>{if(tm===hm&&!firedSupp[d+s.id+tm]){firedSupp[d+s.id+tm]=1;fire("s",t(["سپلیمنٹ:","Supplement:"])+" "+s.name)}}));
 st.appts.forEach(a=>{if(a.date===d&&a.time===hm&&!firedSupp[d+a.id]){firedSupp[d+a.id]=1;fire("a",t(["اپائنٹمنٹ:","Appointment:"])+" "+a.title)}})},30000);

/* ============ BOOT ============ */
load();
document.getElementById("langBtn").onclick=()=>{st.lang=st.lang==="ur"?"en":"ur";save();render()};
document.getElementById("themeBtn").onclick=()=>{st.theme=st.theme==="dark"?"light":"dark";save();render()};
window.addEventListener("hashchange",()=>{charts.splice(0).forEach(c=>{try{c.destroy()}catch(e){}});render()});
const _render=render;render=function(){charts.splice(0).forEach(c=>{try{c.destroy()}catch(e){}});_render()};
render();
</script>
</body></html>
